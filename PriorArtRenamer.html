<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prior Art Renamer</title>

<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 1000px;
        margin: 40px auto;
        padding: 0 20px;
        background: #f5f5f5;
    }

    h1 {
        margin-bottom: 5px;
    }

    .panel {
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    button {
        padding: 10px 18px;
        margin-right: 8px;
        cursor: pointer;
        font-size: 14px;
    }

    input {
        width: 60px;
        padding: 8px;
        margin-right: 15px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th, td {
        border-bottom: 1px solid #ddd;
        padding: 10px;
        text-align: left;
    }

    th {
        background: #eee;
    }

    .ok {
        color: green;
    }

    .skip {
        color: #b36b00;
    }

    .error {
        color: red;
    }

    #status {
        margin-top: 15px;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="panel">

<h1>Prior Art Renamer</h1>

<p>
Example:
<br>
<code>Cited Documents (1. CN105630914A.pdf)</code>
<br>
becomes
<br>
<code>D1-CN105630914A.pdf</code>
</p>

<label>
Start from D:
<input id="startNumber" type="number" value="1" min="1">
</label>

<button onclick="selectFolder()">1. Select Folder</button>
<button onclick="renameFiles()" id="renameButton" disabled>
    2. Rename Files
</button>

<div id="status"></div>

<table id="previewTable">
<thead>
<tr>
    <th>#</th>
    <th>Current Filename</th>
    <th>New Filename</th>
    <th>Status</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

let directoryHandle = null;
let renamePlan = [];


/*
    Extracts patent/publication numbers.

    Examples:

    CN105630914A
    CN 105630914 A
    US20050231503A1
    US 2005/0231503 A1
    EP1234567A1
    WO2019123456A1

    Spaces, slashes, dots and hyphens are removed
    from the final application/publication number.
*/
function extractPatentNumber(filename) {

    // Remove final extension.
    const stem = filename.replace(/\.[^.]+$/, "");

    const countryCodes =
        "CN|US|EP|WO|JP|KR|TW|SG|AU|GB|CA|DE|FR|IN|MY|TH|ID|PH|VN|NZ";

    const regex = new RegExp(
        "\\b(" + countryCodes + ")" +
        "[\\s._-]*" +
        "\\d(?:[\\d\\s\\/._-]*\\d)?" +
        "(?:[\\s._-]*[A-Z]\\d?)?" +
        "\\b",
        "i"
    );

    const match = stem.match(regex);

    if (!match) {
        return null;
    }

    // CN 105630914 A -> CN105630914A
    // US 2005/0231503 A1 -> US20050231503A1
    return match[0]
        .replace(/[^A-Za-z0-9]/g, "")
        .toUpperCase();
}


async function selectFolder() {

    if (!("showDirectoryPicker" in window)) {
        alert(
            "Your browser does not support folder access.\n\n" +
            "Please use a recent version of Chrome or Microsoft Edge."
        );
        return;
    }

    try {

        directoryHandle = await window.showDirectoryPicker();

        const permission =
            await directoryHandle.requestPermission({
                mode: "readwrite"
            });

        if (permission !== "granted") {
            throw new Error("Read/write permission was not granted.");
        }

        await buildRenamePlan();

    } catch (err) {

        document.getElementById("status").innerHTML =
            '<span class="error">' + err.message + '</span>';
    }
}


async function buildRenamePlan() {

    renamePlan = [];

    const files = [];

    // Get PDF files only.
    for await (const entry of directoryHandle.values()) {

        if (
            entry.kind === "file" &&
            entry.name.toLowerCase().endsWith(".pdf")
        ) {
            files.push(entry);
        }
    }

    /*
        Alphabetical / natural ordering.

        Example:
        (1....)
        (2....)
        (10....)

        will sort naturally rather than 1,10,2.
    */
    files.sort((a, b) =>
        a.name.localeCompare(
            b.name,
            undefined,
            {
                numeric: true,
                sensitivity: "base"
            }
        )
    );

    let dNumber =
        parseInt(
            document.getElementById("startNumber").value,
            10
        ) || 1;

    for (const fileHandle of files) {

        const patentNumber =
            extractPatentNumber(fileHandle.name);

        if (!patentNumber) {

            renamePlan.push({
                handle: fileHandle,
                oldName: fileHandle.name,
                newName: "",
                valid: false,
                status: "Patent number not detected"
            });

            continue;
        }

        /*
            If it is already named D<number>-..., leave it alone
            but still display it.
        */
        const alreadyRenamed =
            /^D\d+-/i.test(fileHandle.name);

        if (alreadyRenamed) {

            renamePlan.push({
                handle: fileHandle,
                oldName: fileHandle.name,
                newName: fileHandle.name,
                valid: false,
                status: "Already renamed"
            });

            continue;
        }

        const newName =
            `D${dNumber}-${patentNumber}.pdf`;

        renamePlan.push({
            handle: fileHandle,
            oldName: fileHandle.name,
            newName: newName,
            valid: true,
            status: "Ready"
        });

        dNumber++;
    }

    renderPreview();

    document.getElementById("renameButton").disabled =
        !renamePlan.some(x => x.valid);

    document.getElementById("status").innerHTML =
        `${files.length} PDF file(s) found. Review the preview before renaming.`;
}


function renderPreview() {

    const tbody =
        document.querySelector("#previewTable tbody");

    tbody.innerHTML = "";

    renamePlan.forEach((item, index) => {

        const row =
            document.createElement("tr");

        const statusClass =
            item.valid ? "ok" : "skip";

        row.innerHTML = `
            <td>${index + 1}</td>
            <td>${escapeHTML(item.oldName)}</td>
            <td>
                ${item.newName
                    ? escapeHTML(item.newName)
                    : "—"}
            </td>
            <td class="${statusClass}">
                ${escapeHTML(item.status)}
            </td>
        `;

        tbody.appendChild(row);
    });
}


async function fileExists(name) {

    try {

        await directoryHandle.getFileHandle(name);

        return true;

    } catch (err) {

        if (err.name === "NotFoundError") {
            return false;
        }

        throw err;
    }
}


/*
    Browser directory APIs do not universally provide
    a conventional operating-system rename operation.

    Therefore we:

    1. create the new filename;
    2. copy the PDF into it;
    3. delete the old filename.

    Functionally this produces the desired rename.
*/
async function renameSingleFile(item) {

    if (item.oldName === item.newName) {
        return;
    }

    if (await fileExists(item.newName)) {
        throw new Error(
            "Target file already exists: " +
            item.newName
        );
    }

    const sourceFile =
        await item.handle.getFile();

    const targetHandle =
        await directoryHandle.getFileHandle(
            item.newName,
            { create: true }
        );

    const writable =
        await targetHandle.createWritable();

    try {

        await writable.write(sourceFile);

        await writable.close();

    } catch (err) {

        try {
            await writable.abort();
        } catch {}

        throw err;
    }

    /*
        Only delete the source after the new PDF
        has been successfully written.
    */
    await directoryHandle.removeEntry(
        item.oldName
    );
}


async function renameFiles() {

    const validItems =
        renamePlan.filter(x => x.valid);

    if (!validItems.length) {
        return;
    }

    const message =
        `Rename ${validItems.length} file(s)?\n\n` +
        `Example:\n` +
        `${validItems[0].oldName}\n` +
        `→\n` +
        `${validItems[0].newName}`;

    if (!confirm(message)) {
        return;
    }

    const button =
        document.getElementById("renameButton");

    button.disabled = true;

    let renamed = 0;
    let errors = 0;

    for (const item of validItems) {

        document.getElementById("status").textContent =
            `Renaming ${renamed + 1} of ${validItems.length}: ${item.oldName}`;

        try {

            await renameSingleFile(item);

            item.status = "Renamed";
            item.valid = false;

            renamed++;

        } catch (err) {

            item.status =
                "ERROR: " + err.message;

            item.valid = false;

            errors++;
        }

        renderPreview();
    }

    document.getElementById("status").innerHTML =
        `<span class="ok">${renamed} file(s) renamed.</span>` +
        (errors
            ? ` <span class="error">${errors} error(s).</span>`
            : "");
}


function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

</script>

</body>
</html>
